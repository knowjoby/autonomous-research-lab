name: 🧠 Autonomous Research Cycle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SKIP_CI: true

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          echo "✅ Dependencies installed"

      - name: Create directories
        run: |
          mkdir -p content/topics
          mkdir -p content/hypotheses
          mkdir -p content/evidence
          mkdir -p content/validation
          mkdir -p content/reports
          mkdir -p site/content
          echo "✅ Directories created"

      - name: Phase 1 - Discovery
        run: node scripts/discovery/runner.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Phase 2 - Hypothesis Generation
        run: node scripts/hypothesis/generator.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Phase 3 - Evidence Collection
        run: node scripts/evidence/collector.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Phase 4 - Cross Validation
        run: node scripts/validation/cross-validate.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Phase 5 - Synthesis
        run: node scripts/synthesis/report-generator.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Phase 6 - Knowledge Graph
        run: node scripts/knowledge/graph-builder.js
        continue-on-error: true

      - name: Phase 7 - Site Generation
        run: node scripts/publish/site-generator.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest.json for the site
        run: |
          node -e "
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const research = [];
            
            try {
              const reportPath = \`./content/reports/\${date}/report.json\`;
              const hypPath = \`./content/hypotheses/\${date}/hypothesis.json\`;
              const source = fs.existsSync(reportPath) ? reportPath : hypPath;
              if (fs.existsSync(source)) {
                const item = JSON.parse(fs.readFileSync(source, 'utf8'));
                research.push({ ...item, generated_at: item.generated_at || new Date().toISOString() });
              }
            } catch (e) {
              console.log('No research content found for today');
            }
            
            // Create latest.json
            fs.mkdirSync('./site/content', { recursive: true });
            fs.writeFileSync('./site/content/latest.json', JSON.stringify({
              research: research,
              last_update: new Date().toISOString()
            }, null, 2));
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "research-bot[bot]"
          git config --global user.email "research-bot[bot]@users.noreply.github.com"
          
          git add content/ site/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📚 Research update: $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true

